name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'feeziey4'
        required: true
        default: 'feeziey4'
      agent_description:
        description: 'feeziey4'
        required: true
        default: 'feeziey4 AI Agent'

name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify-agent:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ClawHub
        run: npm install -g clawhub@0.7.0

      - name: Install Verified Agent Identity
        run: |
          for i in 1 2 3; do
            clawhub install verified-agent-identity --force && break
            echo "Retrying in 20 seconds..."
            sleep 20
          done
