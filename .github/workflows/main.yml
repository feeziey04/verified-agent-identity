name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'feeziey04'
        required: true
        default: 'feeziey04'
      agent_description:
        description: 'feeziey04'
        required: true
        default: 'feeziey04 AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    # Force all JavaScript actions to use Node.js 24
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22  # Node runtime for your scripts

      - name: Step 1 - Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity

      - name: Install script dependencies
        run: |
          cd scripts
          npm install

      - name: Step 2 - Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Step 3 - Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js \
          --challenge "{\"name\":\"${{ github.event.inputs.agent_name }}\",\"description\":\"${{ github.event.inputs.agent_description }}\"}"
